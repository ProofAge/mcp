name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline checks
        run: python3 scripts/check.py
      - name: Live checks against docs.proofage.net
        if: github.event_name != 'pull_request'
        run: python3 scripts/check.py --live
